<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Pede Forno · Gestão</title>
<link rel="icon" href="/logo-app.png">
<link rel="apple-touch-icon" href="/logo-app.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/animacoes.css">
<style>
  /* Layout copiado do painel do Beacons: menu à esquerda, conteúdo no meio, prévia do celular à direita. */
  :root { color-scheme: light; --borda: #E6E6E6; --mudo: #8A8A8A; --texto: #1C1C1C; --ativo: #E9E9E9; --verde: #5EE29A; --preto: #1C1C1C; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 15px/1.45 Poppins, "Segoe UI", Arial, sans-serif; color: var(--texto); background: #fff; }
  button, input, select { font: inherit; color: var(--texto); }
  button { cursor: pointer; }
  :focus-visible { outline: 3px solid #2563EB; outline-offset: 2px; }
  svg { flex-shrink: 0; }

  .app { display: grid; grid-template-columns: 290px minmax(0, 1fr) 520px; min-height: 100vh; }
  @media (max-width: 1280px) { .app { grid-template-columns: 250px minmax(0, 1fr) 420px; } }
  @media (max-width: 1000px) { .app { grid-template-columns: 1fr; } .lado { display: none; } .menu { position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--borda); } }

  /* Menu */
  .menu { position: sticky; top: 0; height: 100vh; overflow: auto; border-right: 1px solid var(--borda); padding: 18px 14px; display: flex; flex-direction: column; gap: 2px; }
  .marca { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 1.25rem; padding: 0 6px 18px; }
  .marca img { width: 36px; height: 36px; border-radius: 50%; display: block; }
  .item { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; text-align: left; padding: 9px 10px; border-radius: 8px; font-size: 1rem; }
  .item:hover { background: #F4F4F4; }
  .sub { padding-left: 40px; font-size: .95rem; }
  .sub[aria-current=page], .item[aria-current=page] { background: var(--ativo); font-weight: 500; }
  .item[disabled] { color: var(--mudo); cursor: default; background: none; }
  .item small { margin-left: auto; font-size: .7rem; background: #F1F1F1; border-radius: 99px; padding: 1px 8px; }
  .sep { border-top: 1px solid var(--borda); margin: 12px -14px; }

  /* Centro */
  .centro { padding: 0 40px 80px; min-width: 0; }
  /* Barra de salvar (fica no topo enquanto rola) */
  .barra { position: sticky; top: 0; z-index: 8; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 0 -40px 24px; padding: 14px 40px; background: rgba(255,255,255,.96); border-bottom: 1px solid var(--borda); }
  .barra #status { flex: 1; min-width: 0; font-size: .9rem; color: var(--mudo); }
  .barra button { white-space: nowrap; }
  .barra #status.sujo { color: #B45309; font-weight: 500; }
  .barra #status.erro { color: #B42318; background: #FDECEA; border-radius: 8px; padding: 6px 10px; }
  .barra button { height: 40px; border-radius: 8px; padding: 0 16px; font-weight: 500; }
  .barra button:disabled { opacity: .45; cursor: default; }
  .barra .principal { border: 0; background: var(--preto); color: #fff; font-weight: 600; }
  /* Ver prévia em tamanho grande */
  .modal { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.55); display: grid; place-items: center; padding: 16px; }
  .modal-caixa { background: #fff; border-radius: 16px; padding: 16px 20px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; max-height: 100%; }
  .modal-topo { display: flex; gap: 16px; align-items: center; justify-content: space-between; width: 100%; }
  .modal .celular { height: min(844px, calc(100vh - 120px)); }
  /* Histórico */
  .hist { border: 1px solid var(--borda); border-radius: 10px; padding: 14px 18px; margin-bottom: 12px; }
  .hist header { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .hist time { color: var(--mudo); font-size: .85rem; }
  .hist ul { margin: 8px 0 0; padding-left: 20px; }
  h1 { font-size: 1.6rem; font-weight: 600; margin: 8px 0 22px; }
  h2 { font-size: 1.3rem; font-weight: 600; margin: 34px 0 14px; }
  .adicionar { position: relative; }
  .preto { width: 100%; height: 50px; border: 0; border-radius: 8px; background: var(--preto); color: #fff; font-weight: 600; font-size: 1rem; }
  .escolha { position: absolute; z-index: 5; left: 0; right: 0; top: 56px; background: #fff; border: 1px solid var(--borda); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,.12); padding: 8px; }
  .escolha button { display: flex; gap: 14px; align-items: center; width: 100%; border: 0; background: none; text-align: left; padding: 10px; border-radius: 8px; }
  .escolha button:hover { background: #F4F4F4; }
  .escolha small { display: block; color: var(--mudo); }

  .blocos { display: grid; gap: 14px; margin-top: 14px; }
  .bloco { display: flex; align-items: center; gap: 14px; min-height: 72px; padding: 0 18px 0 12px; border: 1px solid var(--borda); border-radius: 8px; background: #fff; cursor: pointer; }
  .bloco:hover { border-color: #CFCFCF; }
  .bloco.alvo { border-color: var(--preto); border-style: dashed; }
  .bloco.arrastando { opacity: .4; }
  .bloco.oculto .nome, .bloco.oculto .chip { opacity: .45; }
  .alca { color: #9A9A9A; cursor: grab; width: 20px; display: grid; place-items: center; }
  .chip { width: 30px; height: 30px; border-radius: 8px; background: var(--verde); display: grid; place-items: center; color: #0F3D22; }
  .chip.preto { background: var(--preto); color: #fff; }
  .nome { flex: 1; min-width: 0; font-size: 1.15rem; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .icone-btn { width: 36px; height: 36px; border: 0; background: none; border-radius: 8px; display: grid; place-items: center; }
  .icone-btn:hover { background: #F1F1F1; }
  .pontos { position: relative; }
  .pontos-menu { position: absolute; right: 0; top: 40px; z-index: 6; min-width: 190px; background: #fff; border: 1px solid var(--borda); border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.12); padding: 6px; }
  .pontos-menu button { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 8px 10px; border-radius: 6px; }
  .pontos-menu button:hover { background: #F4F4F4; }
  .perigo { color: #C62828 !important; }

  /* Editor de bloco */
  .voltar { border: 0; background: none; color: var(--mudo); padding: 0; display: flex; gap: 8px; align-items: center; margin-bottom: 18px; }
  .painel { border: 1px solid var(--borda); border-radius: 12px; padding: 22px; }
  .titulo-bloco { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
  .titulo-bloco input { flex: 1; min-width: 0; border: 0; border-bottom: 1px solid transparent; font-size: 1.25rem; font-weight: 500; padding: 4px 2px; }
  .titulo-bloco input:hover, .titulo-bloco input:focus { border-bottom-color: var(--borda); outline: none; }
  .abas { display: inline-flex; gap: 4px; margin-bottom: 18px; }
  .abas button { border: 0; background: none; padding: 7px 12px; border-radius: 8px; font-weight: 500; color: var(--mudo); }
  .abas button[aria-selected=true] { background: #F1F1F1; color: var(--texto); }
  .link { border: 1px solid var(--borda); border-radius: 10px; padding: 14px 14px 10px; margin-bottom: 12px; display: grid; grid-template-columns: 20px 1fr auto; gap: 0 10px; align-items: start; background: #fff; }
  /* Cartão de link no formato do Beacons: textos à esquerda, miniatura à direita, rodapé com tipo, UTM, ••• e liga/desliga */
  .link-b { border: 1px solid var(--borda); border-radius: 10px; padding: 16px 16px 10px 8px; margin: 14px 0; display: grid; grid-template-columns: 24px 1fr 84px; gap: 4px 12px; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.05); }
  .link-b.alvo { border-color: var(--preto); border-style: dashed; }
  .link-b.oculto .textos { opacity: .45; }
  .link-b .alca { align-self: center; }
  .textos { display: grid; gap: 2px; min-width: 0; }
  .textos input { border: 0; border-radius: 6px; padding: 5px 6px; width: 100%; background: none; }
  .textos input:hover, .textos input:focus { background: #F6F6F6; outline: none; }
  .textos .forte { font-weight: 600; font-size: 1rem; }
  .textos .suave { color: var(--mudo); font-size: .9rem; }
  .textos .url { font-size: .9rem; }
  .rodape-link { grid-column: 2 / -1; display: flex; align-items: center; justify-content: space-between; gap: 8px; border-top: 1px solid #F1F1F1; padding-top: 8px; margin-top: 6px; }
  .rodape-link .esq, .rodape-link .dir { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .rodape-link select { height: 32px; border: 1px solid var(--borda); border-radius: 8px; padding: 0 8px; background: #fff; font-size: .85rem; }
  .rodape-link .chave { margin: 0; font-size: .85rem; font-weight: 400; }
  /* Ferramentas do link (rodapé): animar, agendar, etiqueta, cores */
  .ferr { width: 32px; height: 32px; color: #3A3A3A; }
  .ferr.ligada { color: #fff; background: var(--preto); }
  .painel-ferr { left: 0; right: auto; top: 38px; width: 330px; padding: 14px; display: grid; gap: 10px; cursor: default; }
  .painel-ferr > b { font-size: .95rem; }
  .painel-ferr .ajuda { margin: -6px 0 0; }
  .grade-anim { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .painel-ferr .grade-anim button { display: grid; gap: 6px; place-items: center; width: 100%; height: 72px; border: 1px solid var(--borda); border-radius: 8px; padding: 8px 4px; text-align: center; overflow: hidden; }
  .painel-ferr .grade-anim button[aria-pressed=true] { border: 2px solid var(--preto); }
  .barra-anim { display: block; width: 70%; height: 16px; border-radius: 99px; background: #BDBDBD; }
  [aria-pressed=true] > .barra-anim { background: var(--preto); }
  .barra-anim.nenhuma { background: linear-gradient(to top right, transparent 47%, #E5A0A0 48%, #E5A0A0 52%, transparent 53%); border-radius: 4px; height: 30px; }
  .painel-ferr small { font-size: .68rem; text-transform: uppercase; letter-spacing: .04em; color: var(--mudo); }
  .campo-mini { display: grid; gap: 4px; font-size: .8rem; color: var(--mudo); }
  .campo-mini input[type=datetime-local], .campo-mini input[type=text] { height: 38px; border: 1px solid var(--borda); border-radius: 8px; padding: 0 10px; }
  .campo-mini.cor { display: flex; align-items: center; justify-content: space-between; padding: 0; }
  .campo-mini.cor input { width: 40px; height: 40px; }
  .linha-botoes { display: flex; gap: 6px; flex-wrap: wrap; }
  .painel-ferr .linha-botoes button { display: inline-block; width: auto; border: 1px solid var(--borda); border-radius: 99px; padding: 4px 12px; font-size: .8rem; }
  .icone-escolha.quadrado { width: 84px; height: 84px; border-radius: 10px; border: 0; background: #F1F1F1; }
  .a-direita .pontos-menu { left: auto; right: 0; top: 90px; }
  /* Abas Layout e Configurações */
  .opcoes { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  .opcoes button { border: 1px solid var(--borda); background: #fff; border-radius: 10px; display: grid; place-items: center; color: #9E9E9E; }
  .opcoes button[aria-pressed=true] { border: 2px solid var(--preto); color: var(--preto); }
  .opcoes button:disabled { opacity: .55; cursor: not-allowed; }
  .opcoes .grande { width: 120px; height: 96px; }
  .opcoes .pequeno { width: 46px; height: 46px; font-weight: 600; }
  .opcoes figure { margin: 0; text-align: center; }
  .opcoes figcaption { font-size: .85rem; margin-top: 6px; color: var(--mudo); }
  .opcoes button[aria-pressed=true] + figcaption { color: var(--texto); }
  .link.alvo { border-color: var(--preto); border-style: dashed; }
  .link.oculto .campos { opacity: .5; }
  .link .alca { padding-top: 10px; }
  .link .acoes-link { display: flex; }
  .campos { display: grid; gap: 8px; }
  .duas { display: grid; grid-template-columns: 44px 170px 1fr; gap: 8px; align-items: center; }
  @media (max-width: 1200px) { .duas { grid-template-columns: 44px 1fr; } .duas > :last-child { grid-column: 1 / -1; } }
  .icone-escolha { width: 44px; height: 44px; border: 1px dashed #BDBDBD; border-radius: 50%; background: #fff; display: grid; place-items: center; color: #581512; padding: 0; overflow: hidden; font-size: 1.3rem; }
  .icone-escolha img { width: 100%; height: 100%; object-fit: cover; }
  .grade-icones { left: 0; right: auto; display: grid; grid-template-columns: repeat(5, 42px); gap: 6px; padding: 10px; }
  .grade-icones > button { width: 42px; height: 42px; display: grid; place-items: center; padding: 0; border-radius: 8px; color: #581512; }
  .grade-acoes { grid-column: 1 / -1; display: flex; gap: 6px; margin-top: 4px; }
  .grade-acoes button { flex: 1; font-size: .8rem; padding: 7px 6px; border: 1px solid var(--borda) !important; text-align: center !important; }
  .linha-img { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .miniatura { width: 72px; height: 72px; border-radius: 10px; object-fit: cover; background: #581512; border: 1px solid var(--borda); }
  .duas-redes { display: grid; grid-template-columns: 36px 1fr; gap: 8px; align-items: center; }
  .icone-rede { display: grid; place-items: center; color: #581512; }
  .campo input, .campo select, .campos input, .campos select { width: 100%; height: 44px; border: 1px solid var(--borda); border-radius: 8px; padding: 0 12px; background: #fff; }
  .campo { margin-bottom: 14px; }
  .campo label, .rot { display: block; font-size: .85rem; color: var(--mudo); margin-bottom: 4px; }
  .ajuda { font-size: .8rem; color: var(--mudo); margin: 4px 0 0; }
  .chave { display: flex; align-items: center; gap: 10px; font-size: .9rem; font-weight: 500; margin: 6px 0; cursor: pointer; }
  .chave input { appearance: none; width: 36px; height: 20px; border-radius: 99px; background: #D4D4D4; position: relative; margin: 0; cursor: pointer; transition: background .15s; flex-shrink: 0; }
  .chave input::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .chave input:checked { background: var(--preto); }
  .chave input:checked::after { transform: translateX(16px); }
  .secundario { border: 1px solid var(--borda); background: #fff; border-radius: 8px; padding: 9px 14px; font-weight: 500; }

  /* Design */
  .cartao { border: 1px solid var(--borda); border-radius: 12px; padding: 20px 22px; }
  .perfil { display: flex; gap: 16px; align-items: center; margin-bottom: 18px; }
  .perfil img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; background: #581512; }
  .grupo-cor { font-weight: 600; margin: 18px 0 4px; }
  .grupo-cor:first-child { margin-top: 0; }
  .cor { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; color: #6B6B6B; }
  .cor input { appearance: none; width: 58px; height: 58px; border-radius: 50%; border: 1px solid var(--borda); padding: 0; background: none; cursor: pointer; overflow: hidden; }
  .cor input::-webkit-color-swatch-wrapper { padding: 0; }
  .cor input::-webkit-color-swatch { border: 0; border-radius: 50%; }
  .cor input::-moz-color-swatch { border: 0; border-radius: 50%; }
  .estilos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
  .estilos button { width: 100%; border: 1px solid var(--borda); background: #fff; border-radius: 8px; height: 120px; display: grid; place-items: center; }
  .estilos button[aria-pressed=true] { border: 2px solid var(--preto); }
  .estilos span { display: block; width: 60%; height: 26px; background: #BDBDBD; }
  .estilos button[aria-pressed=true] span { background: var(--preto); }
  .estilos p { text-align: center; margin: 6px 0 0; color: var(--mudo); }
  .estilos p.sel { color: var(--texto); }

  /* Resultados e Histórico usam a largura toda (sem o celular ao lado) */
  .app.sem-previa { grid-template-columns: 290px minmax(0, 1fr); } /* também Usuários e Minha conta */
  .app.sem-previa .lado { display: none; }
  @media (max-width: 1280px) { .app.sem-previa { grid-template-columns: 250px minmax(0, 1fr); } }
  @media (max-width: 1000px) { .app.sem-previa { grid-template-columns: 1fr; } }
  /* Resultados — cores das séries da paleta validada (azul = visitas, laranja = cliques) */
  .res { --s1: #2a78d6; --s2: #eb6834; --grade: #e1e0d9; --eixo: #898781; --tinta2: #52514e; }
  .cab-res { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin: 8px 0 18px; }
  .cab-res h1 { margin: 0; }
  .filtros { display: inline-flex; gap: 4px; background: #F1F1F1; border-radius: 10px; padding: 4px; }
  .filtros button { border: 0; background: none; border-radius: 8px; padding: 6px 12px; font-weight: 500; color: var(--mudo); }
  .filtros button[aria-pressed=true] { background: #fff; color: var(--texto); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .tile { border: 1px solid var(--borda); border-radius: 12px; padding: 14px 16px; display: grid; gap: 2px; align-content: start; }
  .tile strong { font-size: 1.75rem; font-weight: 600; line-height: 1.2; }
  .var { font-size: .8rem; color: var(--mudo); }
  .var.sobe { color: #006300; }
  .var.desce { color: #d03b3b; }
  .res-sec { border: 1px solid var(--borda); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
  .res-sec h2 { margin: 0 0 4px; font-size: 1.1rem; }
  .res-sec > .ajuda { margin: 0 0 12px; }
  .legenda { display: flex; gap: 18px; font-size: .85rem; color: var(--tinta2); margin: 8px 0 4px; }
  .legenda i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
  .grafico { position: relative; }
  .grafico svg { width: 100%; height: auto; display: block; touch-action: pan-y; }
  .dica { position: absolute; top: 4px; pointer-events: none; background: #fff; border: 1px solid var(--borda); border-radius: 8px; box-shadow: 0 4px 14px rgba(0,0,0,.1); padding: 8px 10px; font-size: .8rem; white-space: nowrap; transform: translateX(-50%); }
  .dica b { display: block; margin-bottom: 2px; }
  .dica i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  .funil { display: grid; gap: 10px; }
  .passo { display: grid; grid-template-columns: 210px 1fr 150px; gap: 12px; align-items: center; font-size: .9rem; }
  .passo .trilho-barra { background: #F4F4F4; border-radius: 4px; }
  .passo .barra { height: 24px; border-radius: 0 4px 4px 0; min-width: 2px; }
  .passo .valor { font-variant-numeric: tabular-nums; font-weight: 600; }
  .passo small { display: block; color: var(--mudo); font-size: .75rem; font-weight: 400; }
  @media (max-width: 760px) { .passo { grid-template-columns: 1fr; gap: 4px; } }
  .tabela { overflow-x: auto; }
  .tabela table { width: 100%; border-collapse: collapse; font-size: .88rem; }
  .tabela th, .tabela td { padding: 8px 10px; border-bottom: 1px solid #EEEEEE; text-align: left; white-space: nowrap; }
  .tabela thead th { color: var(--mudo); font-weight: 500; font-size: .8rem; }
  .tabela .num { text-align: right; font-variant-numeric: tabular-nums; }
  .tabela tbody th { font-weight: 500; }
  .duas-col { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
  .tile strong.estado { font-size: .95rem; font-weight: 600; line-height: 1.6; color: var(--mudo); }
  .filtros-funil { display: flex; flex-wrap: wrap; gap: 10px 14px; margin-bottom: 14px; }
  .filtro-funil { display: grid; gap: 2px; font-size: .8rem; color: var(--mudo); }
  .filtro-funil select { min-width: 150px; }
  .sub-funil { margin: 14px 0 2px; font-size: .95rem; }
  .link-btn { border: 0; background: none; padding: 0; font: inherit; font-weight: 600; color: var(--texto); text-decoration: underline; cursor: pointer; }
  tr.arquivada { opacity: .6; }
  .aviso-ga { background: #FFF8E6; border: 1px solid #F5DFA6; border-radius: 10px; padding: 10px 14px; font-size: .85rem; margin-bottom: 16px; }
  details.numeros { margin-top: 10px; font-size: .85rem; }
  details.numeros summary { cursor: pointer; color: var(--mudo); }

  /* Fundo do topo (foto, vídeo ou carrossel) e tamanho da logo */
  .fundo-tipo { margin: 4px 0 14px; }
  .fotos-capa { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 12px; margin: 8px 0 12px; }
  .foto-capa { position: relative; border: 1px solid var(--borda); border-radius: 10px; overflow: hidden; background: #581512; }
  .foto-capa img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; }
  .foto-capa .ctrl { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-between; padding: 4px; background: linear-gradient(transparent, rgba(0,0,0,.65)); }

  .foto-capa .ordem { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,.6); color: #fff; font-size: .72rem; border-radius: 99px; padding: 0 8px; }

  .deslizante { display: flex; align-items: center; gap: 12px; }
  .deslizante input[type=range] { flex: 1; height: 28px; accent-color: #1C1C1C; }
  .deslizante output { min-width: 56px; text-align: right; font-variant-numeric: tabular-nums; }

  /* Quem está logado (rodapé do menu) */
  .eu { margin-top: auto; border-top: 1px solid var(--borda); padding: 14px 6px 0; display: grid; gap: 2px; }
  .eu b { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .usuario { border: 1px solid var(--borda); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; display: grid; gap: 10px; }
  .usuario.inativo { background: #FAFAFA; }
  .usuario .topo-u { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .usuario .topo-u input { flex: 1; min-width: 160px; height: 38px; border: 1px solid transparent; border-radius: 8px; padding: 0 8px; font-weight: 600; }
  .usuario .topo-u input:hover, .usuario .topo-u input:focus { border-color: var(--borda); outline: none; }
  .usuario .mail { color: var(--mudo); font-size: .88rem; word-break: break-all; }
  .selo { display: inline-block; font-size: .72rem; font-weight: 600; padding: 2px 10px; border-radius: 99px; background: #E8F5EC; color: #14532D; }
  .selo.pendente { background: #FFF3D6; color: #7A4B00; }
  .selo.off { background: #EEE; color: #555; }
  .linha-u { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .linha-u select { height: 36px; border: 1px solid var(--borda); border-radius: 8px; padding: 0 8px; background: #fff; }
  .linha-u .secundario { padding: 6px 12px; font-size: .85rem; }
  .form-u { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
  .form-u .largo { grid-column: 1 / -1; }
  @media (max-width: 700px) { .form-u { grid-template-columns: 1fr; } }
  .campo select { width: 100%; height: 44px; border: 1px solid var(--borda); border-radius: 8px; padding: 0 12px; background: #fff; }
  .msg { font-size: .88rem; margin: 10px 0 14px; }
  .msg.erro { color: #B42318; background: #FDECEA; border-radius: 8px; padding: 8px 12px; }
  .msg.ok { color: #14532D; background: #E8F5EC; border-radius: 8px; padding: 8px 12px; }

  /* Lado direito: endereço + celular */
  .lado { position: sticky; top: 0; height: 100vh; padding: 40px 12px; display: flex; flex-direction: column; align-items: center; }
  .rotulo { font-size: .75rem; font-weight: 600; letter-spacing: .06em; color: var(--mudo); align-self: stretch; max-width: 420px; margin: 0 auto 6px; width: 100%; }
  .dominio { display: flex; gap: 8px; width: 100%; max-width: 420px; }
  .dominio .url { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; height: 42px; border: 1px solid var(--borda); border-radius: 8px; padding: 0 12px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .dominio .icone-btn { border: 1px solid var(--borda); width: 42px; height: 42px; }
  .lado .rotulo-previa { margin: 16px 0 8px; font-size: .8rem; color: var(--mudo); }
  /* 375 px por dentro = largura de um celular comum, para a prévia quebrar as linhas igual ao aparelho */
  .celular { width: 395px; height: min(832px, calc(100vh - 190px)); flex-shrink: 0; border: 10px solid var(--preto); border-radius: 40px; overflow: hidden; background: #581512; }
  .celular iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>

</div>
<script src="/icones.js"></script>
<script>
  // Ícones da interface do admin (traço simples, estilo do Beacons)
  const ICON = {
    menuGrade: '<path d="M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 17h6M17 14v6"/>',

    olho: '<path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
    olhoFechado: '<path d="M3 3l18 18M10.6 5.1A9.7 9.7 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6A17 17 0 0 0 2 12s3.6 7 10 7a9.6 9.6 0 0 0 5.4-1.6M9.9 9.9a3 3 0 0 0 4.2 4.2"/>',
    lixo: '<path d="M4 7h16M10 11v6M14 11v6M5 7l1 13h12l1-13M9 7V4h6v3"/>',
    voltar: '<path d="M19 12H5M11 6l-6 6 6 6"/>',
    loja: '<path d="M4 10v10h16V10M3 10l2-6h14l2 6M3 10h18M9 20v-6h6v6"/>',
    link: '<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
    card: '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M12 5v14M15 10h3M15 14h3"/>',
    pessoa: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
    relogio: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    pessoas: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M16 4.6a3.5 3.5 0 0 1 0 6.8M21.5 20a6 6 0 0 0-4-5.6"/>',
    estrela: '<path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z"/>',
    calendario: '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M8 14h3v3H8z"/>',
    etiqueta: '<path d="M3 12V4a1 1 0 0 1 1-1h8l9 9-9 9z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
    paleta: '<path d="M12 3a9 9 0 1 0 0 18c1.1 0 1.5-.8 1.2-1.6-.4-1-.1-2.4 1.6-2.4H17a4 4 0 0 0 4-4c0-5.5-4-10-9-10z"/><circle cx="7.5" cy="11" r="1"/><circle cx="10" cy="7" r="1"/><circle cx="15" cy="7.5" r="1"/>',
    classico: '<path d="M5 6h14M5 10h14M5 14h14M5 18h14" stroke-width="3"/>',
    carrossel: '<rect x="3" y="9" width="5" height="6"/><rect x="9.5" y="9" width="5" height="6"/><rect x="16" y="9" width="5" height="6"/>',
    grade: '<path d="M4 4h4v4H4zM10 4h4v4h-4zM16 4h4v4h-4zM4 10h4v4H4zM10 10h4v4h-4zM16 10h4v4h-4zM4 16h4v4H4zM10 16h4v4h-4zM16 16h4v4h-4z"/>',
    cards: '<path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z"/>',
    esquerda: '<path d="M4 6h16M4 10h10M4 14h16M4 18h10"/>',
    centro: '<path d="M4 6h16M7 10h10M4 14h16M7 18h10"/>',
    direita: '<path d="M4 6h16M10 10h10M4 14h16M10 18h10"/>',
    aberto: '<path d="M5 5h14M5 9.5h14M5 14h14M5 18.5h14" stroke-width="2.5"/>',
    recolhido: '<path d="M4 12h16" stroke-width="4"/><path d="M16 11l1.5 1.5L19 11"/>',
  };
  const svg = (n, t = 20) => `<svg width="${t}" height="${t}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;
  for (const s of document.querySelectorAll('[data-i]')) s.outerHTML = svg(s.dataset.i);

  const $ = id => document.getElementById(id);
  // Sessão vencida (ou usuário desativado): qualquer chamada que volte 401 leva para a tela de entrada.
  const _fetch = window.fetch.bind(window);
  window.fetch = async (...a) => { const r = await _fetch(...a); if (r.status === 401) location.reload(); return r; };
  const el = (tag, props = {}, ...filhos) => { const e = Object.assign(document.createElement(tag), props); e.append(...filhos.flat(Infinity).filter(x => x != null && x !== false)); return e; };
  const html = (tag, props, codigo) => { const e = el(tag, props); e.innerHTML = codigo; return e; }; // só com ícones fixos acima, nunca com dados
  const PADRAO = { cor: '#581512', cor_topo: '#FFFFFF', cor_bloco: '#FFFFFF', cor_texto: '#581512', fonte: 'Actor', estilo: 'oval', sombra: '0', contorno: '0', capa_tipo: 'foto', capa_intervalo: '5', logo_tamanho: '190' };
  const FONTES = ['Actor', 'Inter', 'Poppins', 'Montserrat', 'Nunito', 'Roboto', 'Lora', 'Playfair Display'];
  const NOME_ACAO = { pedido: 'Faça Seu Pedido', whatsapp: 'WhatsApp', mapa: 'Localização', link: '' };
  const PADRAO_OPCOES = { layout: 'classico', visibilidade: 'aberto', tamanho: 'p', alinhamento: 'centro', posicao_imagem: 'esquerda', tamanho_texto: 'g', contorno: false, sombra: false, miniatura: '', pai_tamanho: 'compacto', pai_cor_bloco: '', pai_cor_texto: '' };
  const VAZIO = 'data:image/gif;base64,R0lGODlhAQABAAAAACw='; // miniatura vazia (mostra só o fundo cinza)
  const PRESETS = {
    links: ['link', 'Bloco de links', 'Botões simples, um embaixo do outro.'],
    unidade: ['loja', 'Unidade', 'Botão que abre com Pedido, WhatsApp e Localização.'],
    card: ['card', 'Card', 'Imagem de um lado e texto do outro (ex.: Cardápio).'],
    carrossel: ['carrossel', 'Carrossel de imagens', 'Fotos lado a lado que deslizam.'],
  };

  let estado, vista = 'blocos', editando = null, aba = 'links';

  // ---------- Salvar (manual) e prévia do rascunho ----------
  let salvando = false, sujo = false, versao = 0, timerPrevia;
  const aviso = (t, tipo = '') => { $('status').textContent = t; $('status').className = tipo === true ? 'erro' : tipo; };
  const barra = () => { $('salvar').disabled = $('descartar').disabled = !sujo || salvando; };
  function marcar() {
    sujo = true; versao++;
    if (!salvando) aviso('Alterações não salvas', 'sujo');
    barra();
    clearTimeout(timerPrevia); timerPrevia = setTimeout(enviarPrevia, 150);
  }
  // A prévia mostra o rascunho como o público veria: só o que está visível.
  function dadosPrevia() {
    const visivel = l => l.ativo !== false;
    return { config: { ...estado.config, redes: JSON.stringify(estado.config.redes), capa_fotos: JSON.stringify(estado.config.capa_fotos || []) }, links: estado.links.filter(visivel).map(l => ({ ...l, filhos: l.filhos.filter(visivel) })) };
  }
  function enviarPrevia() {
    if (!estado) return;
    for (const f of document.querySelectorAll('iframe.previa')) f.contentWindow?.postMessage({ tipo: 'previa', dados: dadosPrevia() }, location.origin);
  }
  async function api(corpo) {
    const r = await fetch('/api/admin' + (corpo ? '' : '?dados=1'), corpo
      ? { method: 'POST', headers: { 'content-type': 'application/json', 'x-requested-with': 'admin' }, body: JSON.stringify(corpo) }
      : {});
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.erro || `Erro ${r.status}`);
    return d;
  }
  async function salvar() {
    if (salvando || !sujo) return;
    salvando = true; barra();
    aviso('Salvando…');
    const salvandoVersao = versao;
    // Guarda quem foi enviado para devolver os ids novos aos mesmos objetos, mesmo que a tela mude enquanto salva.
    const enviados = estado.links.map(l => [l, [...l.filhos]]);
    try {
      const r = await api({ config: estado.config, links: estado.links });
      enviados.forEach(([l, filhos], i) => { l.id = r.links[i].id; filhos.forEach((f, j) => { f.id = r.links[i].filhos[j].id; }); });
      sujo = versao !== salvandoVersao; // mudou algo enquanto salvava? continua pendente
      aviso(sujo ? 'Alterações não salvas' : `Salvo às ${new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })} · no ar em até 1 min`, sujo ? 'sujo' : '');
    } catch (e) { aviso(e.message, true); }
    salvando = false; barra();
  }
  async function descartar() {
    if (!confirm('Descartar todas as alterações que ainda não foram salvas?')) return;
    try { await carregar(); aviso('Alterações descartadas.'); } catch (e) { aviso(e.message, true); }
  }
  $('salvar').onclick = salvar;
  $('descartar').onclick = descartar;
  addEventListener('keydown', e => { if ((e.ctrlKey || e.metaKey) && e.key === 's') { e.preventDefault(); salvar(); } }); // Ctrl+S
  for (const f of document.querySelectorAll('iframe.previa')) f.onload = enviarPrevia;
  $('ver').onclick = () => {
    const f = el('iframe', { className: 'previa', title: 'Prévia em tamanho grande', src: '/?previa=1' });
    f.onload = enviarPrevia;
    const m = el('div', { className: 'modal', role: 'dialog', ariaModal: 'true', ariaLabel: 'Prévia', onclick: e => { if (e.target === m) m.remove(); } },
      el('div', { className: 'modal-caixa' },
        el('div', { className: 'modal-topo' }, el('b', { textContent: sujo ? 'Prévia com alterações ainda não salvas' : 'Prévia' }),
          el('button', { type: 'button', className: 'secundario', textContent: 'Fechar', onclick: () => m.remove() })),
        el('div', { className: 'celular' }, f)));
    document.body.append(m);
    m.querySelector('button').focus();
  };
  addEventListener('keydown', e => { if (e.key === 'Escape') document.querySelector('.modal')?.remove(); });
  addEventListener('beforeunload', e => { if (salvando || sujo) e.preventDefault(); });

  // ---------- Peças ----------
  function campo(rotulo, obj, chave, { tipo = 'text', dica = '', ajuda = '' } = {}) {
    const i = el('input', { type: tipo, value: obj[chave] ?? '', placeholder: dica });
    i.addEventListener('input', () => { obj[chave] = i.value; marcar(); });
    return el('div', { className: 'campo' }, el('label', {}, rotulo, i), ajuda && el('p', { className: 'ajuda', textContent: ajuda }));
  }
  function chave(rotulo, obj, k, sim = true, nao = false) {
    const i = el('input', { type: 'checkbox', checked: obj[k] === sim });
    i.addEventListener('change', () => { obj[k] = i.checked ? sim : nao; marcar(); });
    return el('label', { className: 'chave' }, i, rotulo);
  }
  function olho(obj, aoMudar) {
    const b = el('button', { type: 'button', className: 'icone-btn' });
    const pintar = () => { b.innerHTML = svg(obj.ativo ? 'olho' : 'olhoFechado'); b.title = obj.ativo ? 'Visível na página (clique para esconder)' : 'Escondido (clique para mostrar)'; b.ariaLabel = b.title; b.ariaPressed = String(!obj.ativo); };
    pintar();
    b.onclick = e => { e.stopPropagation(); obj.ativo = !obj.ativo; pintar(); aoMudar?.(); marcar(); };
    return b;
  }
  function pontos(opcoes) {
    const caixa = el('div', { className: 'pontos' });
    const b = html('button', { type: 'button', className: 'icone-btn', title: 'Mais opções', ariaLabel: 'Mais opções', ariaExpanded: 'false' }, svg('pontos'));
    b.onclick = e => {
      e.stopPropagation();
      const aberto = caixa.querySelector('.pontos-menu');
      fecharMenus();
      if (aberto) return;
      b.ariaExpanded = 'true';
      caixa.append(el('div', { className: 'pontos-menu', role: 'menu' }, opcoes.map(([t, f, cls]) => el('button', { type: 'button', role: 'menuitem', textContent: t, className: cls || '', onclick: ev => { ev.stopPropagation(); fecharMenus(); f(); } }))));
    };
    caixa.append(b);
    return caixa;
  }
  const fecharMenus = () => { document.querySelectorAll('.pontos-menu, .escolha').forEach(m => m.remove()); document.querySelectorAll('[aria-expanded=true]').forEach(b => { b.ariaExpanded = 'false'; }); };
  addEventListener('click', fecharMenus);

  // ---------- Imagens: reduz no navegador e envia para o banco ----------
  // Imagem sem perda: se o arquivo já é JPG/PNG/WebP de tamanho razoável, vai exatamente como está.
  // Só arquivos grandes demais são reduzidos (lado maior = max) e regravados em qualidade alta.
  async function enviarImagem(arquivo, max) {
    aviso('Enviando imagem…');
    const bmp = await createImageBitmap(arquivo);
    let blob = arquivo;
    const pronto = ['image/jpeg', 'image/png', 'image/webp'].includes(arquivo.type) && arquivo.size <= 2.5e6 && Math.max(bmp.width, bmp.height) <= max;
    if (!pronto) {
      const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
      const tela = Object.assign(document.createElement('canvas'), { width: Math.round(bmp.width * k), height: Math.round(bmp.height * k) });
      const ctx = tela.getContext('2d');
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(bmp, 0, 0, tela.width, tela.height);
      blob = await new Promise(r => tela.toBlob(r, 'image/webp', 0.92)); // WebP mantém o fundo transparente
      if (blob.size > 2.9e6) blob = await new Promise(r => tela.toBlob(r, 'image/webp', 0.8));
    }
    const dados = await new Promise(r => { const f = new FileReader(); f.onload = () => r(String(f.result).split(',')[1]); f.readAsDataURL(blob); });
    const r = await fetch('/api/imagem', { method: 'POST', headers: { 'content-type': 'application/json', 'x-requested-with': 'admin' }, body: JSON.stringify({ tipo: blob.type, dados }) });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(d.erro || 'Não foi possível enviar a imagem.');
    return d.url;
  }
  function escolherArquivo(max, pronto) {
    const i = el('input', { type: 'file', accept: 'image/jpeg,image/png,image/webp' });
    i.onchange = async () => {

  // Gráfico de linhas: visitas (azul) e cliques (laranja), um só eixo, dica ao passar o mouse.
  function grafico(d) {
    const porDia = Object.fromEntries(d.diario.map(x => [x.dia, x]));
    const dias = [];
    for (let i = d.dias - 1; i >= 0; i--) {
      const k = new Date(Date.now() - i * 864e5).toLocaleDateString('sv-SE', { timeZone: FUSO }); // AAAA-MM-DD no fuso de Teresina
      dias.push({ dia: k, visitas: porDia[k]?.visitas || 0, cliques: porDia[k]?.cliques || 0 });
    }
    const W = 760, H = 250, m = { e: 44, d: 14, t: 14, b: 30 };
    const maior = Math.max(1, ...dias.map(x => Math.max(x.visitas, x.cliques)));
    // 4 divisões redondas (1, 2, 2,5 ou 5 × 10ⁿ) que cobrem o maior valor
    const bruto = maior / 4;
    const pot = 10 ** Math.floor(Math.log10(bruto));
    const passo = [1, 2, 2.5, 5, 10].map(f => f * pot).find(v => v >= bruto && Number.isInteger(v)) || Math.ceil(bruto);
    const topo = passo * 4;
    const x = i => m.e + (i * (W - m.e - m.d)) / Math.max(1, dias.length - 1);
    const y = v => H - m.b - (v / topo) * (H - m.t - m.b);
    const linha = k => dias.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p[k]).toFixed(1)}`).join('');
    const grade = [0, 1, 2, 3, 4].map(n => {
      const v = n * passo;
      return `<line x1="${m.e}" x2="${W - m.d}" y1="${y(v)}" y2="${y(v)}" stroke="var(--grade)" stroke-width="1"/><text x="${m.e - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--eixo)" style="font-variant-numeric:tabular-nums">${v.toLocaleString('pt-BR')}</text>`;
    }).join('');
    const marcas = [0, Math.floor((dias.length - 1) / 2), dias.length - 1].map(i => `<text x="${x(i)}" y="${H - 8}" text-anchor="${i === 0 ? 'start' : i === dias.length - 1 ? 'end' : 'middle'}" font-size="11" fill="var(--eixo)">${dataCurta(dias[i].dia)}</text>`).join('');
    const caixa = el('div', { className: 'grafico' });
    caixa.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Visitas e cliques por dia nos últimos ${d.dias} dias">${grade}${marcas}
      <path d="${linha('visitas')}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <path d="${linha('cliques')}" fill="none" stroke="var(--s2)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      <g class="mira" visibility="hidden"><line y1="${m.t}" y2="${H - m.b}" stroke="var(--eixo)" stroke-width="1" stroke-dasharray="3 3"/>
        <circle r="4.5" fill="var(--s1)" stroke="#fff" stroke-width="2"/><circle r="4.5" fill="var(--s2)" stroke="#fff" stroke-width="2"/></g>
      <rect x="${m.e}" y="0" width="${W - m.e - m.d}" height="${H}" fill="transparent"/></svg>`;
    const svgEl = caixa.querySelector('svg');
    const mira = caixa.querySelector('.mira');
    const [traco, p1, p2] = mira.children;
    const dica = el('div', { className: 'dica', hidden: true });
    caixa.append(dica);
    const mostrar = e => {
      const r = svgEl.getBoundingClientRect();
      const px = ((e.clientX - r.left) * W) / r.width;
      const i = Math.max(0, Math.min(dias.length - 1, Math.round(((px - m.e) / (W - m.e - m.d)) * (dias.length - 1))));
      const p = dias[i];
      traco.setAttribute('x1', x(i)); traco.setAttribute('x2', x(i));
      p1.setAttribute('cx', x(i)); p1.setAttribute('cy', y(p.visitas));
      p2.setAttribute('cx', x(i)); p2.setAttribute('cy', y(p.cliques));
      mira.setAttribute('visibility', 'visible');
      const data = new Date(`${p.dia}T12:00:00`).toLocaleDateString('pt-BR', { weekday: 'short', day: '2-digit', month: '2-digit' });
      dica.replaceChildren(el('b', { textContent: data }),
        el('div', {}, el('i', { style: 'background:var(--s1)' }), `Visitas: ${fmt(p.visitas)}`),
        el('div', {}, el('i', { style: 'background:var(--s2)' }), `Cliques: ${fmt(p.cliques)}`));
      dica.hidden = false;
      dica.style.left = `${Math.min(Math.max((x(i) / W) * r.width, 70), r.width - 70)}px`;
    };
    svgEl.addEventListener('pointermove', mostrar);
    svgEl.addEventListener('pointerdown', mostrar);
    svgEl.addEventListener('pointerleave', () => { mira.setAttribute('visibility', 'hidden'); dica.hidden = true; });
    const legenda = el('div', { className: 'legenda' }, el('span', {}, el('i', { style: 'background:var(--s1)' }), 'Visitas'), el('span', {}, el('i', { style: 'background:var(--s2)' }), 'Cliques'));
    const numeros = el('details', { className: 'numeros' }, el('summary', { textContent: 'Ver os números por dia' }),
      tabela(['Dia', 'Visitas', 'Cliques'], dias.slice().reverse().map(p => [dataCurta(p.dia), fmt(p.visitas), fmt(p.cliques)]), ''));
    return [legenda, caixa, numeros];
  }

    }));

    const email = el('input', { type: 'email', placeholder: 'nome@empresa.com', ariaLabel: 'E-mail', autocomplete: 'off' });

  let campanhaAberta = null; // utm_id da campanha aberta no detalhe
  async function campanhasApi(corpo) {
    const r = await fetch('/api/admin?campanhas=1', { method: 'POST', headers: { 'content-type': 'application/json', 'x-requested-with': 'admin' }, body: JSON.stringify(corpo) });
    const d = await r.json().catch(() => ({}));

    return [
      formCampanha(),
      secao('Campanhas cadastradas', 'Visitas e cliques vêm da página (contagens). Pedidos e receita vêm do Google Analytics e só de sessões que chegaram com o utm_id da campanha: compra direta, sem campanha ou de campanha de fora do hub não entra. Registros antigos (sem utm_id) só entram em visitas e cliques quando origem, meio e campanha são exatamente os da campanha.',
        lista.length ? el('div', { className: 'tabela' }, el('table', {}, el('thead', {}, el('tr', {}, ['Campanha', 'Origem / meio / campanha', 'Criada em', 'Visitas', 'Cliques em pedido', 'Pedidos atribuídos', 'Receita', 'Link'].map((t, i) => el('th', { textContent: t, scope: 'col', className: i > 2 && i < 7 ? 'num' : '' })))), el('tbody', {}, lista.map(linha))))
          : el('p', { className: 'ajuda', textContent: 'Nenhuma campanha ainda. Crie a primeira acima.' })),
    ];
  }

  function detalheCampanha(d) {
    const c = d.campanha, h = d.hub;
    const renomear = el('button', { type: 'button', textContent: 'Renomear', onclick: async () => {
      const nome = prompt('Novo nome interno da campanha (os links não mudam):', c.nome);
      if (nome == null) return;
      try { await campanhasApi({ acao: 'renomear', uid: c.uid, nome }); desenhar(); } catch (e) { alert(e.message); }
    } });
    const arquivar = el('button', { type: 'button', textContent: c.arquivada ? 'Restaurar' : 'Arquivar', onclick: async () => {
      if (!c.arquivada && !confirm('Arquivar esta campanha? O link continua funcionando e o histórico fica guardado.')) return;
      try { await campanhasApi({ acao: c.arquivada ? 'restaurar' : 'arquivar', uid: c.uid }); desenhar(); } catch (e) { alert(e.message); }
    } });
    const voltar = el('button', { type: 'button', textContent: '← Todas as campanhas', onclick: () => { campanhaAberta = null; desenhar(); } });
    const tile = (rot, valor, dica = '', medido = null) => el('div', { className: 'tile', title: medido?.motivo || dica }, el('span', { className: 'rot', textContent: rot }), el('strong', { textContent: valor, className: medido && medido.valor == null ? 'estado' : '' }));
    return [
      el('div', { className: 'painel' }, voltar, el('h2', { textContent: `${c.nome}${c.arquivada ? ' (arquivada)' : ''}` }),
        el('p', { className: 'ajuda', textContent: `${[c.origem, c.meio, c.campanha].filter(Boolean).join(' / ')} · utm_id ${c.uid} · criada em ${dataBR(c.criado)}` }),
        el('input', { type: 'text', readOnly: true, value: c.curto || c.link, ariaLabel: 'Link da campanha' }), botaoCopiar(c.curto || c.link, c.curto ? 'Copiar link curto' : 'Copiar link'), c.curto ? botaoCopiar(c.link, 'Copiar link completo') : null, renomear, arquivar),
      el('div', { className: 'tiles', style: 'margin-top:16px' },
        tile('Visitas', fmt(h.visitas), 'Cada abertura da página conta uma visita'), tile('Cliques', fmt(h.cliques)), tile('Cliques em pedido', fmt(h.cliques_pedido)),
        tile('Pedidos atribuídos', txt(d.vendas.pedidos), 'Só sessões da Tuigo com o utm_id desta campanha', d.vendas.pedidos),
        tile('Receita', txt(d.vendas.receita, brl), 'Só sessões da Tuigo com o utm_id desta campanha', d.vendas.receita),
        tile('Compradores', txt(d.vendas.compradores), 'Só sessões da Tuigo com o utm_id desta campanha', d.vendas.compradores)),
      h.antigos ? el('p', { className: 'ajuda', textContent: `Inclui ${fmt(h.antigos)} registros antigos (sem utm_id) cujos origem, meio e campanha são exatamente os desta campanha. Vendas nunca usam essa correspondência.` }) : null,
      secao('Cliques por botão', 'Cliques no período vindos desta campanha. Venda por botão só aparece com evidência (o id do botão em utm_term); se a campanha define o próprio termo, as vendas ficam só no total acima.',
        tabela(['Botão', 'Unidade', 'Cliques', 'Pedidos', 'Receita'], d.botoes.map(b => [b.nome, b.unidade_nome || '–', fmt(b.cliques), b.removido ? '–' : txt(b.pedidos), b.removido ? '–' : txt(b.receita, brl)]), 'Nenhum botão.')),
      secao('Cliques por unidade', '', tabela(['Unidade', 'Cliques'], d.unidades.map(u => [u.nome, fmt(u.cliques)]), 'Nenhum clique em unidade no período.')),
      secao('Etapas disponíveis da jornada', 'Cada etapa no seu escopo, só de sessões com o utm_id desta campanha.', ...(d.jornada ? desenharFunil(d.jornada) : [el('p', { className: 'ajuda', textContent: ESTADO.indisponivel })])),
    ].filter(Boolean);
  }

  // ---------- Vista: Histórico ----------
  // ---------- Vista: Criar links (gera o endereço da página com UTM; salvar cria o link rastreável) ----------
  const ORIGENS = [['whatsapp', 'WhatsApp'], ['instagram', 'Instagram'], ['facebook', 'Facebook'], ['tiktok', 'TikTok'], ['google', 'Google'], ['email', 'E-mail'], ['sms', 'SMS'], ['outro', 'Outro…']];
  const ONDE = [['bio', 'Bio / perfil'], ['story', 'Story'], ['dm', 'Mensagem direta (DM)'], ['automacao', 'Automação (ex.: palavra-chave)'], ['transmissao', 'Lista de transmissão'], ['grupo', 'Grupo'], ['post', 'Post / reels'], ['anuncio', 'Anúncio pago'], ['qrcode', 'QR code impresso'], ['outro', 'Outro…']];
  const limpar = t => t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
  function vistaLinks() {
    const sel = (lista) => el('select', {}, lista.map(([v, t]) => el('option', { value: v, textContent: t })));
    const origem = sel(ORIGENS), onde = sel(ONDE);
    const outraO = el('input', { type: 'text', placeholder: 'Nome da origem', hidden: true }), outraM = el('input', { type: 'text', placeholder: 'Onde o link vai ficar', hidden: true });
    const camp = el('input', { type: 'text', placeholder: 'ex.: promo_quinta_pizza_g', maxLength: 80 });
    const saida = el('input', { type: 'text', readOnly: true, ariaLabel: 'Link pronto' });
    const codigo = el('input', { type: 'text', placeholder: 'automático (ou escolha, ex.: insta-bio)', maxLength: 30 });
    const msg = el('p', { className: 'ajuda' });
    const gerar = () => {
      outraO.hidden = origem.value !== 'outro'; outraM.hidden = onde.value !== 'outro';
      const o = limpar(origem.value === 'outro' ? outraO.value : origem.value), m = limpar(onde.value === 'outro' ? outraM.value : onde.value), c = limpar(camp.value);
      const u = new URL(location.origin + '/');
      if (o) u.searchParams.set('utm_source', o); if (m) u.searchParams.set('utm_medium', m); if (c) u.searchParams.set('utm_campaign', c);
      saida.value = o && m ? u.href : '';
      salvar.disabled = !saida.value;
      msg.textContent = saida.value ? 'Quem clicar entra na página e a origem aparece em Resultados como ' + [o, m, c].filter(Boolean).join(' / ') + '.' : 'Preencha a origem e onde o link vai ficar. O nome da campanha é opcional.';
    };
    const rotulo = s => s.selectedOptions[0].textContent.replace('…', '');
    const salvar = el('button', { type: 'button', className: 'primario', textContent: 'Salvar link' });
    const salvos = el('div', {});
    const carregar = () => fetch(`/api/admin?campanhas=1&dias=${periodo}`).then(r => (r.ok ? r.json() : Promise.reject(new Error()))).then(d => {
      const ativos = d.campanhas.filter(c => !c.arquivada);
      salvos.replaceChildren(secao('Links salvos', 'Clique no nome para ver as métricas. Salvar gera um utm_id: assim o link também atribui pedidos e receita.',
        ativos.length ? el('div', { className: 'tabela' }, el('table', {}, el('thead', {}, el('tr', {}, ['Link', 'Origem / onde / campanha', 'Visitas', 'Cliques', 'Pedidos', ''].map(t => el('th', { textContent: t, scope: 'col' })))),
          el('tbody', {}, ativos.map(c => el('tr', {}, el('th', { scope: 'row' }, el('button', { type: 'button', className: 'link-btn', textContent: c.nome, onclick: () => { campanhaAberta = c.uid; ir('campanhas'); } })),
            el('td', { textContent: [c.origem, c.meio, c.campanha].filter(Boolean).join(' / ') }), el('td', { textContent: fmt(c.visitas) }), el('td', { textContent: fmt(c.cliques) }),
            el('td', { textContent: txt(c.pedidos) }), el('td', {}, botaoCopiar(c.curto || c.link, c.curto ? 'Copiar link curto' : 'Copiar link'), c.curto ? botaoCopiar(c.link, 'Copiar link completo') : null))))))
          : el('p', { className: 'ajuda', textContent: 'Nenhum link salvo ainda.' })));
    }).catch(() => salvos.replaceChildren(el('p', { className: 'ajuda', textContent: 'Não foi possível carregar os links salvos.' })));
    salvar.onclick = async () => {
      salvar.disabled = true;
      const o = limpar(origem.value === 'outro' ? outraO.value : origem.value), m = limpar(onde.value === 'outro' ? outraM.value : onde.value), c = limpar(camp.value);
      try {
        await campanhasApi({ acao: 'criar', nome: [rotulo(origem), rotulo(onde), camp.value.trim()].filter(Boolean).join(' – ').slice(0, 80), origem: o, meio: m, campanha: c, codigo: limpar(codigo.value).replace(/_/g, '-') });
        camp.value = ''; codigo.value = ''; msg.textContent = 'Link salvo! Ele aparece na lista abaixo.'; await carregar();
      } catch (e) { msg.textContent = e.message; }
      salvar.disabled = !saida.value;
    };
    for (const e of [origem, onde, camp, outraO, outraM]) e.oninput = gerar;
    gerar(); carregar();
    const copiar = el('button', { type: 'button', textContent: 'Copiar link', onclick: async () => { if (!saida.value) return; try { await navigator.clipboard.writeText(saida.value); } catch { saida.select(); document.execCommand('copy'); } copiar.textContent = 'Copiado!'; setTimeout(() => (copiar.textContent = 'Copiar link'), 1500); } });
    const campo = (rot, ...x) => el('div', { className: 'campo' }, el('label', { textContent: rot }), ...x);
    return [el('div', { className: 'res' }, el('div', { className: 'cab-res' }, el('h1', { textContent: 'Criar links' })),
      el('p', { className: 'ajuda', textContent: 'Gere o endereço da página para cada divulgação. O link pronto aparece sem precisar de campanha (ex.: Instagram + Bio). Para acompanhar as métricas, salve o link: o link copiado depois de salvo tem utm_id e atribui visitas, cliques e vendas. Links só copiados, sem salvar, não têm métricas próprias.' }),
      el('div', { className: 'painel', style: 'max-width:560px;margin-top:16px' },
        campo('Origem', origem, outraO), campo('Onde o link vai ficar', onde, outraM),
        campo('Nome da campanha (opcional)', camp), campo('Código do link curto (só vale ao salvar)', codigo), campo('Link pronto', saida, msg), copiar, salvar),
      salvos)];
  }
  function vistaHistorico() {
    const lista = el('div', {}, el('p', { className: 'ajuda', textContent: 'Carregando…' }));
    fetch('/api/admin?historico=1').then(r => (r.ok ? r.json() : Promise.reject(new Error()))).then(itens => {
      lista.replaceChildren(...(itens.length ? itens.map(h => el('article', { className: 'hist' },
        el('header', {}, el('b', { textContent: h.usuario }), el('time', { dateTime: h.ts, textContent: new Date(h.ts).toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) })),
        el('ul', {}, h.mudancas.map(m => el('li', { textContent: m }))))) : [el('p', { className: 'ajuda', textContent: 'Nenhuma alteração salva ainda.' })]));
    }).catch(() => lista.replaceChildren(el('p', { className: 'ajuda', textContent: 'Não foi possível carregar o histórico.' })));
    return [el('h1', { textContent: 'Histórico' }), el('p', { className: 'ajuda', textContent: 'As últimas 100 alterações salvas: quando, quem e o que mudou.' }), lista];
  }

  // ---------- Navegação ----------
  function ir(v) { vista = v; editando = null; aba = 'links'; desenhar(); scrollTo(0, 0); }
  function editar(l) { vista = 'editor'; editando = l; aba = 'links'; desenhar(); scrollTo(0, 0); }
  function desenhar() {
    fecharMenus();
    for (const b of document.querySelectorAll('[data-vista]')) {
      if (b.dataset.vista === (vista === 'editor' ? 'blocos' : vista)) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    }
    document.querySelector('.app').classList.toggle('sem-previa', ['resultados', 'campanhas', 'links', 'historico', 'usuarios', 'conta'].includes(vista));
    $('centro').replaceChildren(...(vista === 'design' ? vistaDesign() : vista === 'historico' ? vistaHistorico() : vista === 'resultados' ? vistaResultados() : vista === 'campanhas' ? vistaCampanhas() : vista === 'links' ? vistaLinks()
      : vista === 'usuarios' && estado.eu.papel === 'admin' ? vistaUsuarios() : vista === 'conta' && !estado.eu.mestra ? vistaConta()
      : vista === 'editor' && editando ? vistaEditor(editando) : vistaBlocos()));
  }
  for (const b of document.querySelectorAll('[data-vista]')) b.onclick = () => ir(b.dataset.vista);
  $('m-grupo').onclick = () => ir('blocos');

  // Endereço público à direita
  const publico = location.origin + '/';
  $('dominio').textContent = location.host;
  $('abrir').href = publico;
  $('copiar').onclick = async () => { try { await navigator.clipboard.writeText(publico); aviso('Endereço copiado.'); } catch { aviso(publico); } };

  async function carregar() {
    const d = await api();
    const c = d.config;
    try { c.redes = JSON.parse(c.redes || 'null'); } catch { c.redes = null; }
    if (!Array.isArray(c.redes)) c.redes = c.instagram ? [{ rede: 'instagram', url: c.instagram, ativo: true }] : []; // páginas antigas
    try { c.capa_fotos = JSON.parse(c.capa_fotos || '[]'); } catch { c.capa_fotos = []; }
    if (!Array.isArray(c.capa_fotos)) c.capa_fotos = [];
    for (const l of d.links) {
      l.opcoes = { ...PADRAO_OPCOES, ...(l.opcoes || {}) };
      for (const f of l.filhos) f.opcoes ||= {};
    }
    estado = d;
    $('eu-nome').textContent = d.eu.nome;
    $('eu-papel').textContent = d.eu.mestra ? 'Conta mestra (emergência)' : `${NIVEL[d.eu.papel]} · ${d.eu.email}`;
    $('m-usuarios').hidden = d.eu.papel !== 'admin';
    $('minha-conta').hidden = d.eu.mestra;
    if (editando) editando = estado.links.find(l => l.id === editando.id) || null; // Descartar volta ao bloco que estava aberto
    if (vista === 'editor' && !editando) vista = 'blocos';
    sujo = false; barra(); aviso('Tudo salvo');
    desenhar();
    enviarPrevia();
  }
  $('minha-conta').onclick = () => { if (sujo && !confirm('Há alterações não salvas. Sair desta tela mesmo assim?')) return; vista = 'conta'; editando = null; desenhar(); scrollTo(0, 0); };
  $('sair').onclick = async () => {
    if (sujo && !confirm('Há alterações não salvas. Sair mesmo assim?')) return;
    sujo = false; // o aviso do navegador ao fechar a página não faz mais sentido
    await fetch('/api/acesso', { method: 'POST', headers: { 'content-type': 'application/json', 'x-requested-with': 'admin' }, body: JSON.stringify({ acao: 'sair' }) });
    location.href = '/admin';
  };
  carregar().catch(e => aviso(e.message, true));
</script>
</body>
</html>
